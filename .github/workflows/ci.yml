name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloudflare Pages Function syntax
        run: node --input-type=module --check < 'functions/api/[[path]].js'
      - name: Check dashboard JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('public/index.html', 'utf8');
          const match = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!match) throw new Error('Dashboard script not found');
          new Function(match[1]);
          console.log('Dashboard JavaScript syntax OK');
          NODE
      - name: Validate D1 migration
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const sql = fs.readFileSync('migrations/0001_initial.sql', 'utf8');
          for (const table of ['apps', 'logs', 'login_attempts']) {
            if (!new RegExp('CREATE TABLE IF NOT EXISTS ' + table + '\\b', 'i').test(sql)) {
              throw new Error('Missing D1 table: ' + table);
            }
          }
          console.log('D1 schema migration OK');
          NODE
      - name: Validate legacy Docker Compose files
        run: |
          cp .env.example .env
          docker compose config --quiet
